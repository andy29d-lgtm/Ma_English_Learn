<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">

<title>English Learning App</title>

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">

<style>
body{
  margin:0;
  font-family:Arial;
  background:#eef6ff;
  text-align:center;
  padding:12px;
}

.container{
  max-width:700px;
  margin:auto;
  background:white;
  padding:16px;
  border-radius:12px;
}

button{
  width:100%;
  padding:14px;
  margin:6px 0;
  font-size:16px;
  border:none;
  border-radius:10px;
  background:#f0f0f0;
}

button:active{transform:scale(0.98);}

.correct{background:#b6f2c2 !important;}
.wrong{background:#ffb3b3 !important;}

input{
  width:95%;
  padding:12px;
  font-size:16px;
  margin:10px 0;
}

#game{display:none;}

.score{font-size:18px;margin:6px;}
.small{font-size:14px;opacity:0.7;}
</style>
</head>

<body>

<div class="container">

<h1>🎮 English Learning App</h1>
<p class="small">Adaptive KI Lernsystem</p>

<div id="startScreen">
  <input id="name" placeholder="Dein Name">
  <button id="startBtn" disabled>Start</button>
  <p class="small">Name eingeben</p>
</div>

<div id="game">
  <div class="score" id="score">Score: 0</div>
  <div class="score" id="streak">Streak: 0</div>

  <h2 id="question"></h2>
  <div id="answers"></div>
</div>

</div>

<script>

let player="";
let score=0;
let streak=0;
let current=null;

// 🧠 Lern-Gedächtnis (KI Effekt)
let memory = JSON.parse(localStorage.getItem("memory")||"{}");

const questions=[
 {q:"go → past",a:"went",o:["goed","went","gone"]},
 {q:"eat → past",a:"ate",o:["eated","ate","eaten"]},
 {q:"see → past",a:"saw",o:["seen","saw","seed"]},
 {q:"She ___ (go)",a:"goes",o:["go","goes","going"]},
 {q:"They ___ (play)",a:"play",o:["plays","play","playing"]},
 {q:"run → past",a:"ran",o:["runned","ran","run"]},
 {q:"think → past",a:"thought",o:["thinked","thought","thunk"]}
];

function shuffle(a){
 return a.sort(()=>Math.random()-0.5);
}

// 🧠 KI Auswahl: Fehler kommen öfter
function pickQuestion(){
 let pool=[];
 questions.forEach(q=>{
   let weight = (memory[q.q]||1);
   for(let i=0;i<weight;i++) pool.push(q);
 });
 return pool[Math.floor(Math.random()*pool.length)];
}

// 🔊 Sound
function sound(ok){
 try{
  let ctx=new (window.AudioContext||window.webkitAudioContext)();
  let o=ctx.createOscillator();
  o.frequency.value=ok?700:200;
  o.connect(ctx.destination);
  o.start();
  setTimeout(()=>o.stop(),120);
 }catch(e){}
}

// 🎮 nächste Frage
function next(){
 current = pickQuestion();

 document.getElementById("question").innerText=current.q;

 let box=document.getElementById("answers");
 box.innerHTML="";

 shuffle([...current.o]).forEach(opt=>{
   let b=document.createElement("button");
   b.innerText=opt;
   b.onclick=()=>check(opt,b);
   box.appendChild(b);
 });
}

// ✅ Antwort prüfen
function check(ans,btn){

 document.querySelectorAll("button").forEach(b=>b.disabled=true);

 if(ans===current.a){
   btn.classList.add("correct");
   score++;
   streak++;
   sound(true);

   memory[current.q]=Math.max(1,(memory[current.q]||1)-1);
 }else{
   btn.classList.add("wrong");
   streak=0;
   sound(false);

   memory[current.q]=(memory[current.q]||1)+2;
 }

 localStorage.setItem("memory",JSON.stringify(memory));

 document.getElementById("score").innerText="Score: "+score;
 document.getElementById("streak").innerText="Streak: "+streak;

 setTimeout(next,800);
}

// 🚀 Start
function startGame(){
 let name=document.getElementById("name").value.trim();
 if(!name) return;

 player=name;

 document.getElementById("startScreen").style.display="none";
 document.getElementById("game").style.display="block";

 score=0;
 streak=0;

 next();
}

// 🧷 FIX: funktioniert auf iPhone + Chrome
window.addEventListener("DOMContentLoaded",()=>{

 const name=document.getElementById("name");
 const btn=document.getElementById("startBtn");

 name.addEventListener("input",()=>{
   btn.disabled=name.value.trim()==="";
 });

 btn.addEventListener("click",startGame);
});

</script>

</body>
</html>
